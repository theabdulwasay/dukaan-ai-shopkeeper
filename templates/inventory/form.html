{% extends "base.html" %}
{% block title %}{{ 'Edit Product' if product else 'Add Product' }} — Dukaan AI{% endblock %}
{% block content %}

<div class="card">
  <h2>{{ '✏ Edit Product' if product else '➕ Add New Product' }}</h2>
  <form method="post">
    <div class="field">
      <label>Product Name</label>
      <input type="text" name="name" required value="{{ product.name if product else '' }}" placeholder="e.g. Chai Patti (Tea Leaves)">
    </div>
    <div class="row2">
      <div class="field">
        <label>Category</label>
        <input type="text" name="category" value="{{ product.category if product else '' }}" placeholder="e.g. Grocery">
      </div>
      <div class="field">
        <label>Unit</label>
        <input type="text" name="unit" value="{{ product.unit if product else 'pcs' }}" placeholder="e.g. pcs, kg, bag, bottle">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Selling Price (Rs.)</label>
        <input type="number" step="0.01" min="0" name="price" required value="{{ product.price if product else '' }}">
      </div>
      <div class="field">
        <label>Cost Price (Rs., optional)</label>
        <input type="number" step="0.01" min="0" name="cost_price" value="{{ product.cost_price if product else '' }}">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Stock Quantity</label>
        <input type="number" min="0" name="stock_qty" required value="{{ product.stock_qty if product else 0 }}">
      </div>
      <div class="field">
        <label>Low Stock Alert Threshold</label>
        <input type="number" min="0" name="low_stock_threshold" value="{{ product.low_stock_threshold if product else 5 }}">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" type="submit">{{ 'Save Changes' if product else 'Add Product' }}</button>
      <a class="btn ghost" href="{{ url_for('inventory.list_products') }}">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
